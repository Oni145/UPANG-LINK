<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPANG LINK Admin</title>
  <!-- Font Awesome CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="../WEB/css/users.css">
  <link rel="stylesheet" href="../WEB/css/notifications.css">
</head>
<body>
  <!-- Loading Indicator -->
  <div id="loadingIndicator">
    <img id="loadingLogo" src="assets/phinma-logo.png" alt="Loading..." />
  </div>

  <div class="wrapper">
    <!-- Sidebar -->
    <nav id="sidebar">
      <div class="sidebar-header">
        <img src="assets/upang-logo.png" alt="UPANG LINK" class="logo">
        <h3>UPANG LINK</h3>
        <p class="subtitle">PHINMA Education Network</p>
      </div>
      <ul class="sidebar-menu">
        <li><a href="index.html"><i class="fas fa-house" style="color:green;"></i> DASHBOARD</a></li>
        <li><a href="requests.html"><i class="fas fa-file-lines" style="color:green;"></i> REQUESTS</a></li>
        <li><a href="Approved.html"><i class="fas fa-file-lines" style="color:green;"></i> APPROVED</a></li>
        <li><a href="In-progress.html"><i class="fas fa-file-lines" style="color:green;"></i> IN PROGRESS</a></li>
        <li><a href="Complete.html"><i class="fas fa-file-lines" style="color:green;"></i>COMPLETE</a></li>
        <li><a href="Rejected.html"><i class="fas fa-file-lines" style="color:green;"></i> REJECTED</a></li>
        <li><a href="users.html"><i class="fas fa-users" style="color:green;"></i> USERS</a></li>
      </ul>
    </nav>

    <!-- Page Content -->
    <div id="content">
      <!-- Top Navbar -->
      <header class="top-navbar">
        <button id="toggleSidebar">&#9776;</button>
        <div class="user-info">
            <span id="userFullName">Admin User</span>
      
            <!-- Profile Button with Dropdown -->
            <div style="position: relative; display: inline-block;">
                <button id="profileBtn" style="background: none; border: none; color: black; font-size: 20px; cursor: pointer;">
                    <i class="fa-regular fa-user"></i>
                </button>
      
                <div id="dropdownMenu" style="display: none; position: absolute; right: 0; background: white; color: black; box-shadow: 0px 4px 8px rgba(0,0,0,0.2); border-radius: 5px; min-width: 150px; padding: 10px; border: 1px solid #ddd;">
                    <button onclick="auth.logout()" style="background: none; border: none; color: black; width: 100%; text-align: left; cursor: pointer; padding: 8px; font-size: 14px;">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </div>
            </div>
           <!-- Notification Bell Button -->
 <!-- Notification Bell -->
 <button id="notificationButton" class="bell-icon">
  <i class="fa-regular fa-bell"></i>
  <span id="notificationBadge" class="notification-badge" style="display: none;">0</span>
</button>
<!-- Notification Dropdown -->
<div id="notificationDialog" class="dropdown">
  <div class="dropdown-header">
      NOTIFICATIONS
      <button id="closeDropdown">&times;</button>
  </div>
  <!-- Mark All as Read Button -->
  <button id="markAllRead" class="mark-all-read">MARK ALL AS READ</button>
  <!-- Notifications List -->
  <ul id="notificationsList"></ul>             
  </div>
</button>

<!-- Overlay for closing the dialog when clicked outside -->
<div id="overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 999;"></div>

<!-- Notification Dialog -->
<div id="notificationDialog" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2); z-index: 1000; width: 300px; border-radius: 5px;">
  <i class="fa-solid fa-xmark"></i>  </button>
  <!-- Added notifications list here -->
</div>           
        </div>
      </header>
      
      <script>
        document.getElementById('profileBtn').addEventListener('click', function () {
            var dropdown = document.getElementById('dropdownMenu');
            dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
        });
      
        document.addEventListener('click', function (event) {
            var dropdown = document.getElementById('dropdownMenu');
            var profileBtn = document.getElementById('profileBtn');
      
            if (!profileBtn.contains(event.target) && !dropdown.contains(event.target)) {
                dropdown.style.display = 'none';
            }
        });
      </script>

      <!-- Main Content -->
      <main>
        <div class="card">
          <div class="card-header">
            <span>Users</span>
            <div id="paginationContainer"></div>
          </div>
          <div class="card-body">
            <input type="text" id="searchInput" placeholder="Search by Name and Email......">
            <div class="table-responsive">
              <table>
                <thead>
                  <tr>
                    <th>USER ID</th>
                    <th>NAME</th>
                    <th>EMAIL</th>
                  </tr>
                </thead>
                <tbody id="usersTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../WEB/js/users.js"></script>
  <script src="../WEB/js/config.js"></script>
  <script src="../WEB/js/notifications.js"></script>

  <script>
    // Toggle sidebar on small screens
    const toggleButton = document.getElementById('toggleSidebar');
    const sidebar = document.getElementById('sidebar');
    toggleButton.addEventListener('click', () => {
      sidebar.classList.toggle('active');
    });

    // Highlight active sidebar menu item based on current page URL.
    document.addEventListener('DOMContentLoaded', () => {
      const currentPage = window.location.pathname.split('/').pop();
      const menuLinks = document.querySelectorAll('#sidebar .sidebar-menu li a');
      menuLinks.forEach(link => {
        if (link.getAttribute('href') === currentPage) {
          link.classList.add('active');
          link.parentElement.classList.add('active');
        } else {
          link.classList.remove('active');
          link.parentElement.classList.remove('active');
        }
      });
    });
  </script>   
</body>
</html>
